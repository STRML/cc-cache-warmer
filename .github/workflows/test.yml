name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - run: shellcheck bin/cache-warmer tests/e2e.sh
      - run: ./tests/e2e.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: tests/out/results.txt
